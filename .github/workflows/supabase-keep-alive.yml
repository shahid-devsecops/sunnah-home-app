name: Supabase Keep-Alive

# Ping the Supabase REST endpoint every 5 days to prevent the free-tier project
# from auto-pausing due to inactivity.
#
# Required repository secrets:
#   SUPABASE_URL      — e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY — the public anon key

on:
  schedule:
    - cron: "0 0 */5 * *" # 00:00 UTC every 5 days
  workflow_dispatch: # allow manual trigger from the Actions UI

jobs:
  keep-alive:
    name: Ping Supabase REST
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/?apikey=${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          echo "Supabase ping response: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "✅ Supabase project is active."
          else
            echo "⚠️  Unexpected response code: $RESPONSE"
            exit 1
          fi
